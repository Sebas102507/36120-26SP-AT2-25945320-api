[project]
requires-python = ">=3.9"
name = "36120-26sp-at2-25945320-api"
version = "0.1.0"
description = "Weather Intelligence API"
authors = [
    { name = "Juan Sebastian Vargas", email = "juan.vargastorres@uts.edu.au" },
]
dependencies = [
    "fastapi>=0.103.0",
    "uvicorn==0.23.2",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.2",
    "httpx>=0.27.0",
]

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
  \.toml
  |\.sh
  |\.git
  |\.ini
  |Dockerfile
  |Jenkinfile
)/
'''

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]