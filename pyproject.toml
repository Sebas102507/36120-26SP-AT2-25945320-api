[project]
requires-python = ">=3.11"
name = "36120-26sp-at2-25945320-api"
version = "1.0.0"
description = "Weather Intelligence API: CCI and WHC forecasts for Sydney (UTS 36120 AT2)"
authors = [
    { name = "Juan Vargas T.", email = "juan.vargastorres@uts.edu.au" },
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.23.2",
    "pydantic>=2.0",
    # The custom package: feature engineering, the pipeline classes the saved artefacts refer
    # to, and OrdinalClassifier. Use the SAME version that fitted the artefacts in ml/model/.
    "nucleus-ml>=0.0.13",
    # Libraries the pickled models need at load time. Keep these on the same versions as the
    # experiments environment so the artefacts unpickle without version warnings.
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "joblib>=1.3",
    "numpy>=1.26",
    "pandas>=2.1",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.2",
    "httpx>=0.27.0",
]

# nucleus-ml is published on TestPyPI. Only that package is taken from TestPyPI; every other
# dependency still comes from PyPI, which avoids picking up unrelated test uploads.
[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
explicit = true

[tool.uv.sources]
nucleus-ml = { index = "testpypi" }

[tool.pytest.ini_options]
pythonpath = ["app"]
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py311"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
