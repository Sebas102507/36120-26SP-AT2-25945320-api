services:
  app:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    command: uvicorn main:app --reload --host 0.0.0.0 --port 8080
    volumes:
      # Live-reload the application code; the artefacts are mounted where MODEL_DIR (/models)
      # points, so rerunning `make artefacts` takes effect without rebuilding the image.
      - ./app:/app
      - ./models:/models
