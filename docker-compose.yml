services:
  app:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    command: uvicorn main:app --reload --host 0.0.0.0 --port 8080
    volumes:
      # Live-reload the application code. The model folder is mounted separately, because
      # mounting ./app over /app would otherwise hide the /app/ml folder baked into the image.
      - ./app:/app
      - ./ml:/app/ml
